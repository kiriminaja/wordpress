#:schema https://phast.sh/schema/v1/manifest.json
[package]
name = "kiriminaja/wordpress"
description = "KiriminAja Official WordPress Plugin for WooCommerce"
license = "GPL-2.0-or-later"

[[package.authors]]
name = "Yanuar"
email = "me@yan.ad"

[[package.authors]]
name = "FaizRA"
email = "faizniflehim@gmail.com"

[require]
php = ">=8.2.35"
"kiriminaja/kiriminaja-php" = "^2.1.4"

[require-dev]
"brianium/paratest" = "~7.3.0"
"php-stubs/wordpress-stubs" = "^7.1"
"phpstan/phpstan" = "^2.2"
"szepeviktor/phpstan-wordpress" = "^2.0"
"php-stubs/woocommerce-stubs" = "^10.0"
"mockery/mockery" = "^1.6"
# 2.1.x requires InstalledVersions::getAllRawData(), absent in phast 0.1.0.
"jean85/pretty-package-versions" = "2.0.6"

[autoload.psr-4]
"KiriminAjaOfficial\\" = ["./inc"]

[scripts]
test = "@php scripts/test-cache.php -- vendor/bin/paratest --configuration paratest.xml --testdox"
phpstan = "@php vendor/bin/phpstan analyse --memory-limit=1G"
"test:force" = "@php scripts/test-cache.php --force -- vendor/bin/paratest --configuration paratest.xml --testdox"

[config]
platform-check = "off"

[config.platform]
php = "8.2.35"
