name: Tests

on:
  pull_request:
    branches:
      - main
      - staging
      - development

  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch when a new commit is pushed.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Frontend checks + package"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: curl, sqlite3, pdo_sqlite, mbstring, dom, xml, zip
          tools: composer
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install gettext
        run: |
          if command -v msgfmt >/dev/null 2>&1; then
            exit 0
          fi
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Build official zip
        id: build
        run: |
          make zip
          ZIP_FILE=kiriminaja-official.zip
          test -f "$ZIP_FILE" || { echo "ERROR: build zip not found"; exit 1; }
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: ${{ steps.build.outputs.zip_file }}
          if-no-files-found: error

  static:
    name: "PHP tests (${{ matrix.php }})"
    needs: build
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.5"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, sqlite3, pdo_sqlite, mbstring, dom, xml, zip
          tools: composer
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: ${{ runner.temp }}/plugin-build

      - name: Restore package and generated assets for parity tests
        run: |
          unzip -q "$RUNNER_TEMP/plugin-build/kiriminaja-official.zip" -d build
          rsync -a build/kiriminaja-official/assets/ assets/
          rsync -a build/kiriminaja-official/blocks/ blocks/
          rsync -a build/kiriminaja-official/lang/ lang/

      - name: Run PHP behavior and package tests
        run: make test

  wordpress:
    name: "WP-CLI smoke + Plugin Check (WP ${{ matrix.wp }} / WC ${{ matrix.wc }} / PHP 8.1)"
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: "7.1"
            wc: "11.x"
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mysqli, intl, zip
          tools: composer, wp-cli

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-no-dev-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-no-dev-

      - name: Cache WP-CLI downloads
        uses: actions/cache@v6
        with:
          path: ~/.wp-cli/cache
          key: ${{ runner.os }}-wp-cli-cache

      - name: Install composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Install WordPress
        run: |
          wp core download --version=${{ matrix.wp }} --path=/tmp/wordpress --allow-root
          wp config create --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --path=/tmp/wordpress --allow-root
          wp core install --url=http://localhost --title="Test" --admin_user=admin --admin_password=admin --admin_email=test@test.com --path=/tmp/wordpress --allow-root

      - name: Install WooCommerce
        id: woocommerce
        run: |
          curl --fail --silent --show-error --globoff \
            'https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request[slug]=woocommerce&request[fields][versions]=1' \
            -o "$RUNNER_TEMP/woocommerce-info.json"
          WC_VERSION=$(php -r '
            $info = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $versions = array_filter(array_keys($info["versions"] ?? []), static fn($version) => preg_match("/^11\\.[0-9]+\\.[0-9]+$/", $version));
            if (!$versions) {
              fwrite(STDERR, "No stable WooCommerce 11.x release is available.\n");
              exit(1);
            }
            usort($versions, "version_compare");
            echo end($versions);
          ' "$RUNNER_TEMP/woocommerce-info.json")
          echo "Using WooCommerce $WC_VERSION"
          echo "version=$WC_VERSION" >> "$GITHUB_OUTPUT"
          wp plugin install woocommerce --version="$WC_VERSION" --activate --path=/tmp/wordpress --allow-root

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: /tmp/plugin-build

      - name: Install plugin from clean build
        run: |
          ZIP_FILE=$(ls /tmp/plugin-build/kiriminaja-official*.zip 2>/dev/null | head -1)
          test -n "$ZIP_FILE" || { echo "ERROR: build artifact not found"; exit 1; }
          echo "Found: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d /tmp/wordpress/wp-content/plugins/

      - name: Activate plugin
        run: |
          wp plugin activate kiriminaja-official --path=/tmp/wordpress --allow-root

      - name: Verify plugin is active
        run: |
          wp plugin list --status=active --path=/tmp/wordpress --allow-root | grep kiriminaja-official

      - name: Check for PHP fatal errors
        run: |
          wp eval 'echo "WordPress loaded OK\n";' --path=/tmp/wordpress --allow-root
          wp eval '
            $plugin_data = get_plugin_data("/tmp/wordpress/wp-content/plugins/kiriminaja-official/kiriminaja.php");
            echo "Plugin: " . $plugin_data["Name"] . "\n";
            echo "Version: " . $plugin_data["Version"] . "\n";
          ' --path=/tmp/wordpress --allow-root

      - name: Verify WooCommerce integration
        run: |
          wp eval '
            $methods = WC()->shipping()->get_shipping_methods();
            if (!isset($methods["kiriminaja-official"])) {
              echo "Registered methods: " . implode(", ", array_keys($methods)) . "\n";
              echo "FAIL: kiriminaja-official shipping method not registered\n";
              exit(1);
            }
            echo "KiriminAja shipping method registered OK\n";
          ' --path=/tmp/wordpress --allow-root

      - name: Deactivate and reactivate (lifecycle test)
        run: |
          wp plugin deactivate kiriminaja-official --path=/tmp/wordpress --allow-root
          wp plugin activate kiriminaja-official --path=/tmp/wordpress --allow-root
          wp eval 'echo "Reactivation OK\n";' --path=/tmp/wordpress --allow-root

      - name: Install plugin-check
        run: |
          wp plugin install plugin-check --activate --path=/tmp/wordpress --allow-root

      - name: Run Plugin Check (WP.org compliance)
        id: plugin-check
        run: |
          # wp plugin check exits 1 for any issue (errors OR warnings).
          # Capture output regardless, then fail only on errors.
          wp plugin check kiriminaja-official \
            --path=/tmp/wordpress \
            --allow-root \
            --format=json \
            --categories=general,plugin_repo,security,performance,accessibility \
            > /tmp/plugin-check-results.json 2>&1 || true
          cat /tmp/plugin-check-results.json
          ERRORS=$(php -r '
            $content = file_get_contents("/tmp/plugin-check-results.json");
            $sections = preg_split("/^FILE: /m", $content, -1, PREG_SPLIT_NO_EMPTY);
            $count = 0;
            foreach ($sections as $s) {
              $nl = strpos($s, "\n");
              $items = json_decode(trim(substr($s, $nl)), true) ?: [];
              foreach ($items as $i) { if ($i["type"]==="ERROR") $count++; }
            }
            echo $count;
          ')
          WARNINGS=$(php -r '
            $content = file_get_contents("/tmp/plugin-check-results.json");
            $sections = preg_split("/^FILE: /m", $content, -1, PREG_SPLIT_NO_EMPTY);
            $count = 0;
            foreach ($sections as $s) {
              $nl = strpos($s, "\n");
              $items = json_decode(trim(substr($s, $nl)), true) ?: [];
              foreach ($items as $i) { if ($i["type"]==="WARNING") $count++; }
            }
            echo $count;
          ')
          echo "Plugin Check: ${ERRORS} error(s), ${WARNINGS} warning(s)"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Plugin Check found ${ERRORS} error(s). Fix them before merging."
            exit 1
          fi

      - name: Upload Plugin Check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-check-results-wp-${{ matrix.wp }}-wc-${{ steps.woocommerce.outputs.version || matrix.wc }}
          path: /tmp/plugin-check-results.json
          overwrite: true
